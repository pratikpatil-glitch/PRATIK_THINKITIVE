<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>browser popup boxes</title>
  </head>
  <body>
    <script>
      // Alert is a JavaScript function that displays a message in a small popup box on the screen.
      // Prompt displays a popup box that asks the user to enter some information.
      // Confirm displays a popup asking the user to make a choice between OK and Cancel.

      const proceed = confirm("Do you want to enter your name?");

      if (proceed) {
        const name = prompt("What is your name?");
        alert(`Welcome, ${name || "Guest"}!`);
      } else {
        alert("Maybe next time!");
      }
    </script>
  </body>
</html>
